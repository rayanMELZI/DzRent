# DzRent production stack (single VM, fronted by nginx + Cloudflare Tunnel).
#
# backend  -> 127.0.0.1:${BACKEND_HOST_PORT:-3001}   (nginx /api -> here)
# frontend -> 127.0.0.1:${FRONTEND_HOST_PORT:-3002}  (agency dashboard: nginx / -> here)
# client   -> 127.0.0.1:${CLIENT_HOST_PORT:-3006}    (client website:   nginx / -> here)
# postgres / redis / minio are internal to the compose network (no host ports).
#
# The .env in this directory is BOTH the backend's runtime env_file AND the source
# Compose interpolates ${...} from. See .env.prod.example.
#
# App images are built by GitHub Actions and pulled from GHCR
# (${DZRENT_REGISTRY}/dzrent-*:${DZRENT_TAG}); the server never builds. Deploy with:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --no-build
# The build: blocks remain as a manual fallback (`up -d --build` on a machine with room).
name: dzrent

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: dzrent_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dzrent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dzrent}
    volumes:
      - dzrent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dzrent} -d ${POSTGRES_DB:-dzrent}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dznet]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  redis:
    image: redis:7-alpine
    container_name: dzrent_redis_prod
    restart: always
    volumes:
      - dzrent_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dznet]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # MinIO stopped publishing free images (Docker Hub minio/mc is gone, quay.io
  # needs auth). The VM already has minio/minio:latest locally, and Compose only
  # pulls images that are missing, so keep this exact name. On a fresh machine,
  # swap in an available build (e.g. bitnamilegacy/minio) — check volume perms.
  minio:
    image: minio/minio:latest
    container_name: dzrent_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dzrentminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - dzrent_minio:/data
    networks: [dznet]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # One-shot: create the object-storage buckets the backend expects, then exit.
  # Reuses the server image (it ships the `mc` client) — no extra image to pull.
  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo 'waiting for minio'; sleep 2; done;
      mc mb -p local/${S3_BUCKET_KYC:-dzrent-kyc} local/${S3_BUCKET_VEHICLES:-dzrent-vehicles} local/${S3_BUCKET_CONTRACTS:-dzrent-contracts};
      echo 'buckets ready'; exit 0"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dzrentminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    networks: [dznet]
    restart: 'no'

  backend:
    build:
      context: ./apps/backend
    image: ${DZRENT_REGISTRY:-ghcr.io/rayanmelzi}/dzrent-backend:${DZRENT_TAG:-latest}
    container_name: dzrent_backend
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:-3001}:3000'
    networks: [dznet]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  frontend:
    build:
      context: .
      dockerfile: apps/agency-dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dzrent-agence.rayanemelzi.dev/api/v1}
    image: ${DZRENT_REGISTRY:-ghcr.io/rayanmelzi}/dzrent-agency-dashboard:${DZRENT_TAG:-latest}
    container_name: dzrent_frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-3002}:3000'
    networks: [dznet]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Client website (public marketplace). Same-origin API: nginx routes
  # dzrent.rayanemelzi.dev/api/* to the backend, everything else here.
  client:
    build:
      context: .
      dockerfile: apps/client-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${CLIENT_PUBLIC_API_URL:-https://dzrent.rayanemelzi.dev/api/v1}
        NEXT_PUBLIC_AGENCY_URL: ${AGENCY_PUBLIC_URL:-https://dzrent-agence.rayanemelzi.dev}
    image: ${DZRENT_REGISTRY:-ghcr.io/rayanmelzi}/dzrent-client-web:${DZRENT_TAG:-latest}
    container_name: dzrent_client
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - '127.0.0.1:${CLIENT_HOST_PORT:-3006}:3000'
    networks: [dznet]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  dznet:
    driver: bridge

volumes:
  dzrent_pgdata:
  dzrent_redis:
  dzrent_minio:
