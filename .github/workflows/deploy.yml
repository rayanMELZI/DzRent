name: Deploy to VM

# Two stages:
#   1. build  — GitHub Actions builds the three app images (backend, agency
#               dashboard, client website) in parallel with a layer cache and pushes
#               them to GHCR, tagged with the commit SHA (+ `latest`).
#   2. deploy — ships only the compose file + .env to the VM, pulls those exact
#               images and restarts the app containers. The VM never runs
#               npm/pnpm install or builds anything (small 2-CPU / 30 GB box).
#
# The VM's SSH is behind Cloudflare Access (Zero Trust tunnel — no public port 22),
# reached via `ProxyCommand cloudflared access ssh --hostname %h` with a Cloudflare
# Access SERVICE TOKEN (non-interactive).
#
# GHCR auth: images are pushed with the workflow's GITHUB_TOKEN; the VM logs in
# with that same short-lived token only for the pull, then logs out. No PAT needed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VM_HOST                 Access SSH hostname (e.g. nanovm.rayanemelzi.dev)
#   VM_USER                 SSH user on the server (e.g. deploy)
#   VM_SSH_KEY              private SSH key authorised for VM_USER
#   VM_APP_DIR              deploy dir on the VM (e.g. /home/deploy/dzrent)
#   CF_ACCESS_CLIENT_ID     Cloudflare Access service token Client ID
#   CF_ACCESS_CLIENT_SECRET Cloudflare Access service token Client Secret
#   APP_SECRET              hex32 — HMAC app secret
#   POSTGRES_PASSWORD       strong Postgres password
#   JWT_SECRET              hex32 — access-token secret
#   JWT_REFRESH_SECRET      hex32 — refresh-token secret (different from JWT_SECRET)
#   S3_SECRET_KEY           strong MinIO password
#   GPS_INGEST_SECRET       hex32 — GPS webhook HMAC secret

on:
  workflow_dispatch:
  push:
    branches: [production]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # GHCR paths must be lowercase.
  REGISTRY: ghcr.io/rayanmelzi
  AGENCY_URL: https://dzrent-agence.rayanemelzi.dev
  CLIENT_URL: https://dzrent.rayanemelzi.dev

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: dzrent-backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
          - image: dzrent-agency-dashboard
            context: .
            dockerfile: apps/agency-dashboard/Dockerfile
          - image: dzrent-client-web
            context: .
            dockerfile: apps/client-web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.dzrent.stack=dzrent
          # NEXT_PUBLIC_* are inlined at build time (ignored by the backend image).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ matrix.image == 'dzrent-client-web' && format('{0}/api/v1', env.CLIENT_URL) || format('{0}/api/v1', env.AGENCY_URL) }}
            NEXT_PUBLIC_AGENCY_URL=${{ env.AGENCY_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Build .env and deploy bundle
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          GPS_INGEST_SECRET: ${{ secrets.GPS_INGEST_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          cat > deploy.env <<EOF
          NODE_ENV=production
          APP_PORT=3000
          APP_SECRET=${APP_SECRET}
          CORS_ORIGINS=${AGENCY_URL},${CLIENT_URL}
          NEXT_PUBLIC_API_URL=${AGENCY_URL}/api/v1
          CLIENT_PUBLIC_API_URL=${CLIENT_URL}/api/v1
          AGENCY_PUBLIC_URL=${AGENCY_URL}
          DZRENT_REGISTRY=${REGISTRY}
          DZRENT_TAG=${GITHUB_SHA}
          BACKEND_HOST_PORT=3001
          FRONTEND_HOST_PORT=3002
          CLIENT_HOST_PORT=3006
          POSTGRES_USER=dzrent
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=dzrent
          DATABASE_URL=postgresql://dzrent:${POSTGRES_PASSWORD}@postgres:5432/dzrent?schema=public
          DIRECT_URL=postgresql://dzrent:${POSTGRES_PASSWORD}@postgres:5432/dzrent?schema=public
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_REFRESH_EXPIRES_IN=7d
          REDIS_URL=redis://redis:6379
          TWILIO_ACCOUNT_SID=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_AUTH_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_PHONE_NUMBER=+12125550000
          S3_ENDPOINT=http://minio:9000
          S3_REGION=us-east-1
          S3_ACCESS_KEY=dzrentminio
          S3_SECRET_KEY=${S3_SECRET_KEY}
          S3_BUCKET_KYC=dzrent-kyc
          S3_BUCKET_VEHICLES=dzrent-vehicles
          S3_BUCKET_CONTRACTS=dzrent-contracts
          GPS_INGEST_SECRET=${GPS_INGEST_SECRET}
          EOF
          printf '%s' "$GHCR_TOKEN" > ghcr.token
          # Tracked files only (no .git / node_modules / .env); small — the VM
          # needs just the compose file, but docs/deploy files travel along.
          git archive HEAD | gzip > app.tar.gz

      - name: Configure cloudflared + SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName ${VM_HOST}
            User ${VM_USER}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Ship, pull & restart
        env:
          APP_DIR: ${{ secrets.VM_APP_DIR }}
          GHCR_USER: ${{ github.actor }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          scp app.tar.gz deploy.env ghcr.token vm:/tmp/
          ssh vm APP_DIR="$APP_DIR" GHCR_USER="$GHCR_USER" 'bash -s' <<'REMOTE'
          set -e
          [ -n "$APP_DIR" ] && [ "$APP_DIR" != "/" ] || { echo "VM_APP_DIR is unsafe: '$APP_DIR'"; exit 1; }
          trap 'rm -f /tmp/ghcr.token /tmp/deploy.env /tmp/app.tar.gz; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          mkdir -p "$APP_DIR"
          # Replace the checkout; Docker volumes (DB/redis/minio) live outside this dir.
          find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar xzf /tmp/app.tar.gz -C "$APP_DIR"
          install -m 600 /tmp/deploy.env "$APP_DIR/.env"
          cd "$APP_DIR"
          docker login ghcr.io -u "$GHCR_USER" --password-stdin < /tmp/ghcr.token
          # Only the app images — infra images (postgres/redis/minio) are never
          # silently upgraded by a deploy.
          docker compose -f docker-compose.prod.yml pull backend frontend client
          docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
          # Drop previous DzRent app images no container uses any more.
          docker image prune -af --filter label=com.dzrent.stack=dzrent
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          df -h / | tail -1
          REMOTE

      - name: Smoke test
        run: |
          for url in "$AGENCY_URL" "$AGENCY_URL/api/v1/health" "$CLIENT_URL"; do
            for _ in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              echo "$url -> $code"
              [ "$code" = "200" ] && break
              sleep 10
            done
          done
