name: Deploy to VM

# The VM's SSH is behind Cloudflare Access (Zero Trust tunnel — no public port 22),
# reached via `ProxyCommand cloudflared access ssh --hostname %h`. This workflow
# installs cloudflared and connects through it with a Cloudflare Access SERVICE
# TOKEN (non-interactive). It ships only tracked files (git archive: no .git /
# node_modules / .env) and builds the images on the server.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VM_HOST                 Access SSH hostname (e.g. nanovm.rayanemelzi.dev)
#   VM_USER                 SSH user on the server (e.g. deploy)
#   VM_SSH_KEY              private SSH key authorised for VM_USER
#   VM_APP_DIR              deploy dir on the VM (e.g. /home/deploy/dzrent)
#   CF_ACCESS_CLIENT_ID     Cloudflare Access service token Client ID
#   CF_ACCESS_CLIENT_SECRET Cloudflare Access service token Client Secret
#   APP_SECRET              hex32 — HMAC app secret
#   POSTGRES_PASSWORD       strong Postgres password
#   JWT_SECRET              hex32 — access-token secret
#   JWT_REFRESH_SECRET      hex32 — refresh-token secret (different from JWT_SECRET)
#   S3_SECRET_KEY           strong MinIO password
#   GPS_INGEST_SECRET       hex32 — GPS webhook HMAC secret

on:
  workflow_dispatch:
  push:
    branches: [production]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .env and source archive
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          GPS_INGEST_SECRET: ${{ secrets.GPS_INGEST_SECRET }}
        run: |
          umask 077
          cat > deploy.env <<EOF
          NODE_ENV=production
          APP_PORT=3000
          APP_SECRET=${APP_SECRET}
          CORS_ORIGINS=https://dzrent-agence.rayanemelzi.dev
          NEXT_PUBLIC_API_URL=https://dzrent-agence.rayanemelzi.dev/api/v1
          BACKEND_HOST_PORT=3001
          FRONTEND_HOST_PORT=3002
          POSTGRES_USER=dzrent
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=dzrent
          DATABASE_URL=postgresql://dzrent:${POSTGRES_PASSWORD}@postgres:5432/dzrent?schema=public
          DIRECT_URL=postgresql://dzrent:${POSTGRES_PASSWORD}@postgres:5432/dzrent?schema=public
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_REFRESH_EXPIRES_IN=7d
          REDIS_URL=redis://redis:6379
          TWILIO_ACCOUNT_SID=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_AUTH_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          TWILIO_PHONE_NUMBER=+12125550000
          S3_ENDPOINT=http://minio:9000
          S3_REGION=us-east-1
          S3_ACCESS_KEY=dzrentminio
          S3_SECRET_KEY=${S3_SECRET_KEY}
          S3_BUCKET_KYC=dzrent-kyc
          S3_BUCKET_VEHICLES=dzrent-vehicles
          S3_BUCKET_CONTRACTS=dzrent-contracts
          GPS_INGEST_SECRET=${GPS_INGEST_SECRET}
          EOF
          git archive HEAD | gzip > app.tar.gz

      - name: Configure cloudflared + SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName ${VM_HOST}
            User ${VM_USER}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Ship & deploy
        env:
          APP_DIR: ${{ secrets.VM_APP_DIR }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          scp app.tar.gz deploy.env vm:/tmp/
          ssh vm APP_DIR="$APP_DIR" 'bash -s' <<'REMOTE'
          set -e
          [ -n "$APP_DIR" ] && [ "$APP_DIR" != "/" ] || { echo "VM_APP_DIR is unsafe: '$APP_DIR'"; exit 1; }
          mkdir -p "$APP_DIR"
          # Replace the checkout; Docker volumes (DB/redis/minio) live outside this dir.
          find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar xzf /tmp/app.tar.gz -C "$APP_DIR"
          install -m 600 /tmp/deploy.env "$APP_DIR/.env"
          rm -f /tmp/app.tar.gz /tmp/deploy.env
          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          REMOTE
