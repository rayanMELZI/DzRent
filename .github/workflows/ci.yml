name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Lint, typecheck and build the whole workspace (fast, no services).
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma client must be generated before the backend can typecheck/build.
      - run: pnpm --filter @dzrent/backend exec prisma generate
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  # Backend integration tests need a real Postgres + Redis.
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: dzrent
          POSTGRES_PASSWORD: dzrent_dev_secret
          POSTGRES_DB: dzrent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dzrent"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dzrent:dzrent_dev_secret@localhost:5432/dzrent_test?schema=public
      DIRECT_URL: postgresql://dzrent:dzrent_dev_secret@localhost:5432/dzrent_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare database
        working-directory: apps/backend
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
      - name: Run backend tests
        run: pnpm --filter @dzrent/backend test
