# DzRent nginx reverse proxy (VM).
#
# Cloudflare Tunnel public hostnames point at these local ports:
#   dzrent-agence.rayanemelzi.dev -> http://localhost:4269   (agency dashboard)
#   dzrent.rayanemelzi.dev        -> http://localhost:4242   (client app — Phase 3)
#
# TLS is terminated at Cloudflare; the tunnel reaches nginx over plain HTTP on
# loopback. Install with:
#   sudo cp deploy/nginx/dzrent.conf /etc/nginx/sites-available/dzrent.conf
#   sudo ln -sf /etc/nginx/sites-available/dzrent.conf /etc/nginx/sites-enabled/dzrent.conf
#   sudo nginx -t && sudo systemctl reload nginx

# ── Agency dashboard (+ same-origin API) ──────────────────────────────────────
server {
    listen 127.0.0.1:4269;
    server_name dzrent-agence.rayanemelzi.dev;

    client_max_body_size 25m;        # KYC / vehicle photo uploads

    # API requests are proxied to the backend container. The backend's global
    # prefix is /api/v1, so the /api/ path is forwarded unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Everything else is served by the Next.js frontend container.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── Client app domain (parked until the client PWA ships — Phase 3) ───────────
server {
    listen 127.0.0.1:4242;
    server_name dzrent.rayanemelzi.dev;

    location / {
        default_type text/html;
        return 200 "<!doctype html><meta charset=utf-8><title>DzRent</title><body style=\"font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0;background:#F6F3EC;color:#1D2421\"><div style=\"text-align:center\"><h1 style=\"color:#0F5249\">DzRent</h1><p>Application client bient\xC3\xB4t disponible.</p></div></body>";
    }
}
