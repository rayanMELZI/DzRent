# DzRent nginx reverse proxy (VM).
#
# Cloudflare Tunnel sends both public hostnames to nginx on :80 (TLS terminates at
# Cloudflare); nginx picks the site by `server_name`:
#   dzrent-agence.rayanemelzi.dev -> agency dashboard (127.0.0.1:3002)
#   dzrent.rayanemelzi.dev        -> client website   (127.0.0.1:3006)
# On BOTH hosts `/api/` goes to the backend (127.0.0.1:3001), so each site calls
# its own origin — no CORS. The backend's global prefix is /api/v1, so the path is
# forwarded unchanged.
#
# Install (replaces the older per-site dzrent.conf / dzrent-agency.conf):
#   sudo cp deploy/nginx/dzrent.conf /etc/nginx/sites-available/dzrent.conf
#   sudo rm -f /etc/nginx/sites-enabled/dzrent-agency.conf
#   sudo ln -sf /etc/nginx/sites-available/dzrent.conf /etc/nginx/sites-enabled/dzrent.conf
#   sudo nginx -t && sudo systemctl reload nginx

# Shared upstream settings.
map $http_upgrade $dzrent_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Agency dashboard (+ same-origin API) ──────────────────────────────────────
server {
    listen 80;
    server_name dzrent-agence.rayanemelzi.dev;

    client_max_body_size 25m;        # KYC / vehicle photo uploads

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $dzrent_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── Client website (+ same-origin API) ────────────────────────────────────────
server {
    listen 80;
    server_name dzrent.rayanemelzi.dev;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $dzrent_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
